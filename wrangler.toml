# wrangler.toml
name = 'versacarteplatform'
# Newest date this Wrangler 4.107 workerd accepts. A later date fails to boot.
compatibility_date = "2026-07-08"
main = "worker/index.ts"
upload_source_maps = true

# Static Astro output. /api/* is handled by the Worker; everything else is an asset.
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = [ "/api/*" ]

[observability]
enabled = true

[observability.traces]
enabled = true

[vars]
CONTACT_FROM = "hello@versacarte.com"
SITE_URL = "https://versacarte.com"
